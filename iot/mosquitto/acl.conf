# Access list for the secure broker (v1.1). Read top to bottom.

# The CyberShield backend: reads every device, sends commands and alerts.
user backend
topic readwrite cybershield/#

# Every other user is an IoT device whose user name IS its device ID
# (%u = user name). A device may only:
#   - publish its own readings and status
#   - receive its own commands (quarantine, release, identify, ping)
pattern write cybershield/iot/%u/telemetry
pattern write cybershield/iot/%u/status
pattern read cybershield/iot/%u/command
