# Secure Mosquitto configuration for CyberShield SatCom 3D (v1.1).
#
#  * no anonymous clients: every client needs a user name and password
#  * an access list (ACL): each IoT device may only publish to ITS OWN topics,
#    so a stolen device password can't be used to fake another device
#  * optional TLS on port 8883: readings and passwords travel encrypted
#
# This file is the TEMPLATE. The setup script writes mosquitto-secure.local.conf,
# the same settings with the full paths of your computer:
# 1. Create the password file, the certificates and the local config:
#      python iot\mosquitto\setup_secure_mqtt.py --mosquitto-dir "D:\Program Files\mosquitto"
# 2. Start the broker with the LOCAL file (PowerShell as Administrator):
#      Stop-Service mosquitto
#      & "D:\Program Files\mosquitto\mosquitto.exe" -c iot\mosquitto\mosquitto-secure.local.conf -v
# 3. Put the backend's user/password (printed by the script) in .env.
# Full guide: docs/SECURE_MQTT.md

per_listener_settings false
allow_anonymous false
password_file iot/mosquitto/passwd
acl_file iot/mosquitto/acl.conf

# Plain MQTT with passwords (this computer and your lab network).
listener 1883 0.0.0.0

# Encrypted MQTT (TLS). The certificates are made by setup_secure_mqtt.py.
listener 8883 0.0.0.0
cafile iot/mosquitto/certs/ca.crt
certfile iot/mosquitto/certs/server.crt
keyfile iot/mosquitto/certs/server.key
tls_version tlsv1.2

message_size_limit 4096
log_type error
log_type warning
log_type notice
log_type information
