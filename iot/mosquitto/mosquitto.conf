# Mosquitto configuration for CyberShield SatCom 3D (Phase 11).
#
# By default Mosquitto 2.x only accepts connections from THIS computer
# (localhost). The ESP32 is another device on your Wi-Fi, so the broker must
# listen on the network too.
#
# Use it on Windows (PowerShell as Administrator):
#   Stop-Service mosquitto
#   & "D:\Program Files\mosquitto\mosquitto.exe" -c "D:\PROJECT\CyberShield-SatCom-3D-phase11\iot\mosquitto\mosquitto.conf" -v
#
# Only use this on your own home / lab network. Anyone on that network could
# publish to the broker. For anything else, set allow_anonymous false and add
# a password file (see docs/PHASE11_GUIDE.md).

listener 1883 0.0.0.0
allow_anonymous true

# Keep messages small: an IoT reading is about 100 bytes.
message_size_limit 4096

log_type error
log_type warning
log_type notice
log_type information
